<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>استبيان رضا العاملين – SOPAT MLIHA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Kufi+Arabic:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root{--green:#17682f;--green2:#0f4d22;--yellow:#f4c400;--card:#ffffff;--ink:#1c2b21;--bg:#e9f2e6;--good:#2e9e4f;--mid:#f0b400;--bad:#d9453b}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{font-family:'Noto Kufi Arabic',sans-serif;background:var(--bg);color:var(--ink);display:flex;flex-direction:column;user-select:none}
header{background:#fff;padding:10px 20px 12px;text-align:center;border-bottom:8px solid var(--green);box-shadow:0 4px 0 var(--yellow);position:relative;gap:12px;display:flex;align-items:center;justify-content:flex-end}
header img{height:clamp(64px,12vw,100px);max-width:80%;object-fit:contain}
.pos-indicator{position:absolute;right:16px;top:50%;transform:translateY(-50%);width:96px;height:96px;background:var(--card);border-radius:50%;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 16px #0005;z-index:10;}
.pos-indicator img{width:64px;height:64px;object-fit:contain}
.logo-txt{display:none;background:var(--green);border-radius:50%/40%;padding:2px 38px;color:#fff;font-weight:900;font-size:clamp(34px,7vw,56px)}
main{flex:1;display:flex;align-items:center;justify-content:center;padding:18px}
.card{background:var(--card);width:100%;max-width:900px;border-radius:28px;padding:clamp(18px,4vw,36px);box-shadow:0 10px 30px #0003;text-align:center;animation:in .35s ease}
@keyframes in{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
h1{font-size:clamp(24px,5vw,40px);margin:0 0 10px;color:var(--green)}
p.lead{font-size:clamp(18px,3.2vw,26px);line-height:1.8;margin:0 0 22px}
.btn{font-family:inherit;border:0;border-radius:20px;cursor:pointer;font-weight:700}
.start{background:var(--green);color:#fff;font-size:clamp(24px,4.5vw,34px);padding:16px 56px;box-shadow:0 6px 0 var(--green2)}
.start:active{transform:translateY(4px);box-shadow:0 2px 0 var(--green2)}
.speak{background:var(--yellow);color:#222;font-size:clamp(18px,3vw,24px);padding:10px 24px;margin:0 6px 16px}
.prog{display:flex;gap:6px;justify-content:center;margin-bottom:18px}
.prog i{height:10px;flex:1;max-width:48px;border-radius:6px;background:#9993}
.prog i.d{background:var(--green)}.prog i.c{background:var(--yellow)}
.num{font-size:clamp(16px,2.6vw,20px);opacity:.7}
.q{font-size:clamp(24px,4.8vw,40px);font-weight:900;line-height:1.5;margin:6px 0 22px}
.opts{display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(10px,2.5vw,24px)}
.opt{background:var(--card);border:5px solid var(--c);border-radius:26px;padding:clamp(12px,2.4vw,26px) 6px;display:flex;flex-direction:column;align-items:center;gap:8px;cursor:pointer;font-family:inherit;color:var(--ink);transition:transform .15s}
.opt .f{font-size:clamp(56px,13vw,120px);line-height:1}
.opt .l{font-size:clamp(17px,3.2vw,28px);font-weight:700}
.opt:active{transform:scale(.94)}
.opt.sel{background:var(--c);color:#fff;transform:scale(1.05)}
.nav{display:flex;justify-content:space-between;margin-top:20px}
.nav .btn{font-size:clamp(16px,2.8vw,22px);padding:10px 22px;background:#9992;color:var(--ink)}
.big{font-size:clamp(90px,20vw,160px)}
.res{text-align:right;font-size:18px}
.bar{display:flex;height:22px;border-radius:11px;overflow:hidden;margin:4px 0 14px;background:#9993}
.bar b{display:block}
.sm{font-size:16px;padding:8px 16px;margin:4px}
</style>
</head>
<body>
<div class="pos-indicator" id="posIndicator" aria-hidden="true">
  <img src="pos.png" alt="Reading questions" onerror="this.style.display='none'">
</div>
<header>
  <img id="logo" src="logo.png" alt="مليحة" onerror="this.style.display='none';document.getElementById('lt').style.display='inline-block'">
  <div class="logo-txt" id="lt">مليحة</div>
</header>
<main><div class="card" id="card"></div></main>

<script>
/* ===== إعدادات ===== */
const AUTOPLAY = true;          // يقرأ السؤال تلقائياً عند ظهوره
const TTS_FALLBACK = true;      // إذا ملف الصوت موش موجود، يستعمل صوت الجهاز
const AUDIO_DIR = 'audio/';     // مجلد الملفات الصوتية (mp3)

/* ملفات الصوت المطلوبة: intro.mp3 ، q1.mp3 … q11.mp3 ، thanks.mp3 */
const OPTS = [['😊','var(--good)'],['😐','var(--mid)'],['🙁','var(--bad)']];
const Q = [
 ['هل أنت مرتاح في خدمتك؟',['مرتاح','عادي','موش مرتاح']],
 ['هل تحسّ روحك محترم في الشركة؟',['نعم','أحياناً','لا']],
 ['هل علاقتك مع رئيسك المباشر باهية؟',['باهية','متوسطة','موش باهية']],
 ['هل زملاؤك يعاونوك في الخدمة؟',['ديما','أحياناً','لا']],
 ['هل ظروف العمل مريحة؟',['نعم','متوسطة','لا']],
 ['هل عندك المعدات اللازمة باش تخدم؟',['الكل موجود','بعضها','لا']],
 ['هل تحسّ روحك في أمان أثناء الخدمة؟',['نعم','أحياناً','لا']],
 ['هل وقت الراحة متاعك كافي؟',['نعم','نوعاً ما','لا']],
 ['هل أنت راضي على النظافة في مكان خدمتك؟',['راضي','متوسط','موش راضي']],
 ['هل تحب تواصل تخدم في SOPAT MLIHA؟',['نعم','موش متأكد','لا']],
 ['بصفة عامة، هل أنت راضي على خدمتك في الشركة؟',['راضي برشا','راضي شوية','موش راضي']]
];
const INTRO = 'نحبّو نعرفو رأيكم في الخدمة وظروف العمل في الشركة. إجاباتكم تساعدنا باش نحسّنوا ظروف العمل. اختاروا الصورة اللي تعبّر على رأيكم.';
const THANKS = 'يعطيك الصحة، شكراً على وقتك';

const card = document.getElementById('card');
let i = -1, ans = [], au = null;

function stopAudio(){
  try{ if(au){au.onerror=null;au.pause();au=null} speechSynthesis.cancel() }catch(e){}
}
function say(t){
  if(!TTS_FALLBACK) return;
  try{
    const u = new SpeechSynthesisUtterance(t);
    const v = speechSynthesis.getVoices().find(v=>/^ar/i.test(v.lang));
    u.lang = v ? v.lang : 'ar'; if(v) u.voice = v; u.rate = .85;
    speechSynthesis.speak(u);
  }catch(e){}
}
function play(name, text){
  stopAudio();
  au = new Audio(AUDIO_DIR + name + '.mp3');
  au.onerror = () => say(text);
  au.play().catch(()=>{});
}
function load(){ try{return JSON.parse(localStorage.getItem('sopat_results')||'[]')}catch(e){return []} }
function save(a){ try{const r=load(); r.push({t:Date.now(),a}); localStorage.setItem('sopat_results',JSON.stringify(r))}catch(e){} }

function intro(){
  stopAudio(); i=-1; ans=[];
  card.innerHTML = `<h1>استبيان رضا العاملين</h1>
   <p class="lead">${INTRO}</p>
   <button class="btn speak" id="sp">🔊 اسمع</button><br>
   <button class="btn start" id="go">يلّا نبداو ◀</button>`;
  document.getElementById('sp').onclick=()=>play('intro',INTRO);
  document.getElementById('go').onclick=()=>show(0);
}
function show(n){
  i=n;
  const [q,labels]=Q[n];
  const dots = Q.map((_,k)=>`<i class="${k<n?'d':k===n?'c':''}"></i>`).join('');
  card.style.animation='none'; card.offsetHeight; card.style.animation='';
  card.innerHTML = `<div class="prog">${dots}</div>
   <div class="num">السؤال ${n+1} من ${Q.length}</div>
   <div class="q">${q}</div>
   <button class="btn speak" id="sp">🔊 اسمع السؤال</button>
   <div class="opts">${OPTS.map((o,k)=>`<button class="opt ${ans[n]===k?'sel':''}" style="--c:${o[1]}" data-k="${k}"><span class="f">${o[0]}</span><span class="l">${labels[k]}</span></button>`).join('')}</div>
   <div class="nav"><button class="btn" id="back" ${n===0?'style="visibility:hidden"':''}>▶ رجوع</button><span></span></div>`;
  const replay=()=>play('q'+(n+1), q+'. '+labels.join('، '));
  document.getElementById('sp').onclick=replay;
  document.getElementById('back').onclick=()=>show(n-1);
  card.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
    ans[n]=+b.dataset.k;
    card.querySelectorAll('.opt').forEach(x=>x.classList.remove('sel'));
    b.classList.add('sel');
    setTimeout(()=> n+1<Q.length ? show(n+1) : done(), 380);
  });
  if(AUTOPLAY) replay(); else stopAudio();
}
function done(){
  save(ans);
  card.innerHTML = `<div class="big">🌟</div><h1>يعطيك الصحة!</h1>
   <p class="lead">شكراً على وقتك. رأيك يهمّنا برشا.</p>
   <button class="btn start" id="again">استبيان جديد</button>`;
  play('thanks',THANKS);
  document.getElementById('again').onclick=intro;
  setTimeout(()=>{ if(document.getElementById('again')) intro(); }, 12000);
}

/* لوحة النتائج للمسؤول: اضغط 5 مرات على الشعار */
let taps=0, tt;
document.querySelector('header').onclick=()=>{
  taps++; clearTimeout(tt); tt=setTimeout(()=>taps=0,1500);
  if(taps>=5){ taps=0; admin(); }
};
function admin(){
  stopAudio();
  const r=load(); let clr=false;
  const rows = Q.map((q,n)=>{
    const c=[0,0,0]; r.forEach(x=>{ if(x.a[n]!=null) c[x.a[n]]++ });
    const tot=c[0]+c[1]+c[2]||1;
    return `<div><b>${n+1}. ${q[0]}</b><div class="bar">${c.map((v,k)=>`<b style="width:${v/tot*100}%;background:${OPTS[k][1]}"></b>`).join('')}</div>
     <div style="margin-top:-8px;margin-bottom:10px">😊 ${c[0]} &nbsp; 😐 ${c[1]} &nbsp; 🙁 ${c[2]}</div></div>`;
  }).join('');
  card.innerHTML = `<h1>النتائج (${r.length} مشارك)</h1><div class="res">${rows}</div>
   <button class="btn sm" id="x" style="background:var(--green);color:#fff">رجوع</button>
   <button class="btn sm" id="csv" style="background:var(--yellow)">تحميل CSV</button>
   <button class="btn sm" id="clr" style="background:var(--bad);color:#fff">مسح النتائج</button>`;
  document.getElementById('x').onclick=intro;
  document.getElementById('csv').onclick=()=>{
    const head='date,'+Q.map((_,n)=>'q'+(n+1)).join(',');
    const body=r.map(x=>new Date(x.t).toISOString()+','+x.a.map(v=>['good','mid','bad'][v]).join(',')).join('\n');
    const a=document.createElement('a');
    a.href=URL.createObjectURL(new Blob(['\ufeff'+head+'\n'+body],{type:'text/csv'}));
    a.download='sopat-results.csv'; a.click();
  };
  document.getElementById('clr').onclick=e=>{
    if(!clr){clr=true;e.target.textContent='اضغط مرة أخرى للتأكيد';return}
    try{localStorage.removeItem('sopat_results')}catch(_){} admin();
  };
}
try{speechSynthesis.getVoices()}catch(e){}
intro();
</script>
</body>
</html>
